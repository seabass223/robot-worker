<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0e13" />
    <meta name="description" content="A polished Three.js raycast room — click the floor to guide the cube." />
    <title>Raycast Room</title>
  </head>
  <body>
    <main id="app" aria-label="Interactive 3D room">
      <div class="grain" aria-hidden="true"></div>
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span>RAYCAST ROOM</span>
        </div>
        <div class="status" aria-live="polite">
          <span id="status-dot" class="status-dot"></span>
          <span id="status-text">READY</span>
        </div>
      </header>
      <div class="performance-stats" aria-label="Live geometry performance">
        <div class="performance-stat">
          <span>VERTICES</span>
          <strong id="vertex-count">—</strong>
        </div>
        <div class="performance-stat">
          <span>FRAME RATE</span>
          <strong id="fps-count">— FPS</strong>
        </div>
        <div class="performance-stat">
          <span>DRAW CALLS</span>
          <strong id="draw-call-count">— CALLS</strong>
        </div>
      </div>

      <div class="coordinates" aria-live="polite">
        <span>TARGET</span>
        <strong id="coordinates">X 0.00&nbsp;&nbsp; Z 0.00</strong>
      </div>
      <div id="work-progress" class="work-progress" hidden aria-live="polite">
        <div class="work-progress__meta"><span id="work-label">BENCH TASK</span><strong id="work-percent">0%</strong></div>
        <div class="work-progress__track"><span id="work-progress-fill"></span></div>
      </div>
      <div class="editor-toolbar" aria-label="Scene edit controls">
        <button id="edit-mode-toggle" class="editor-button" type="button" aria-pressed="false">EDIT MODE</button>
        <div id="editor-mode-buttons" class="editor-mode-buttons" hidden>
          <button class="editor-button" type="button" data-editor-mode="translate" title="Move (M)"><kbd>M</kbd> MOVE</button>
          <button class="editor-button" type="button" data-editor-mode="rotate" title="Rotate (R)"><kbd>R</kbd> ROTATE</button>
          <button class="editor-button" type="button" data-editor-mode="scale" title="Uniform scale (S)"><kbd>S</kbd> SCALE</button>
          <button id="save-layout" class="editor-button editor-button--save" type="button">SAVE JSON</button>
        </div>
        <div id="editor-selection" class="editor-selection" hidden>SELECT AN OBJECT</div>
      </div>
      <section id="layout-export" class="layout-export" hidden aria-label="Layout JSON export">
        <div class="layout-export__header"><strong>LAYOUT OVERRIDES</strong><button id="close-layout-export" type="button" aria-label="Close layout export">×</button></div>
        <textarea id="layout-json" readonly spellcheck="false" aria-label="Serialized layout changes"></textarea>
        <button id="copy-layout-json" class="editor-button editor-button--save" type="button">COPY JSON</button>
      </section>
      <canvas id="scene" aria-label="3D room with an articulated red bipedal robot, three workstations, a couch, and an elevated red door. Click the floor to walk, a workstation to begin a task, the couch to sit, or the red door to climb; click the door again at the top to descend."></canvas>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
